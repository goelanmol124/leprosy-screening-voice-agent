<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin &amp; Nerve Health Line (demo)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #eff6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: white;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
    }
    button {
      width: 120px;
      height: 120px;
      border: none;
      border-radius: 50%;
      background: #10b981;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button.active { background: #ef4444; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 16px; color: #4b5563; }
    .panel {
      display: none;
      margin-top: 24px;
      text-align: left;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
    }
    .panel.show { display: block; }
    .risk {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      margin: 8px 0;
    }
    .LOW { background: #dcfce7; color: #166534; }
    .MEDIUM { background: #fef3c7; color: #92400e; }
    .HIGH { background: #fee2e2; color: #991b1b; }
    .EMERGENCY { background: #fecaca; color: #7f1d1d; }
    .row { margin: 10px 0; }
    .label { font-size: 12px; color: #6b7280; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Skin &amp; Nerve Health Line</h1>
    <p>Voice triage for skin and nerve symptoms</p>
    <button id="call-btn">Start</button>
    <div id="status">Click to start call</div>

    <div class="panel" id="panel">
      <div class="label">Risk</div>
      <div class="risk" id="risk"></div>
      <div class="row" id="reason"></div>
      <div class="row"><span class="label">Language</span><div id="lang"></div></div>
      <div class="row"><span class="label">Skin patch</span><div id="skin"></div></div>
      <div class="row"><span class="label">Numbness</span><div id="numb"></div></div>
      <div class="row"><span class="label">Weakness</span><div id="weak"></div></div>
      <div class="row"><span class="label">Advice</span><div id="advice"></div></div>
      <div class="row" id="dispatch"></div>
    </div>
  </div>

  <script type="module">
    const btn = document.getElementById('call-btn');
    const status = document.getElementById('status');
    const panel = document.getElementById('panel');

    let vapi;
    let cfg;
    let callId;
    let onCall = false;

    function showError(msg) {
      console.error(msg);
      status.textContent = msg;
    }

    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web/+esm');
      const Vapi = mod.default?.default || mod.default || mod;
      if (typeof Vapi !== 'function') {
        throw new Error('Vapi SDK failed to load');
      }

      cfg = await fetch('/api/config').then(r => r.json());
      if (!cfg.publicKey || !cfg.assistantId) {
        throw new Error('Missing Vapi config from server');
      }

      vapi = new Vapi(cfg.publicKey);

      vapi.on('call-start', (call) => {
        callId = call?.id || callId;
        onCall = true;
        btn.disabled = false;
        btn.textContent = 'End';
        btn.classList.add('active');
        status.textContent = 'Call in progress...';
        panel.classList.remove('show');
      });

      vapi.on('call-end', async () => {
        onCall = false;
        btn.textContent = 'Start';
        btn.classList.remove('active');
        btn.disabled = true;
        status.textContent = 'Analyzing call...';
        await loadReview();
        btn.disabled = false;
        status.textContent = 'Click to start call';
      });

      vapi.on('message', (m) => {
        if (m.call?.id) callId = m.call.id;
      });

      vapi.on('error', (e) => {
        showError('Call error — try again');
        onCall = false;
        btn.textContent = 'Start';
        btn.classList.remove('active');
        btn.disabled = false;
      });

      btn.onclick = async () => {
        if (onCall) {
          vapi.stop();
          return;
        }
        try {
          callId = null;
          status.textContent = 'Starting call...';
          btn.disabled = true;
          await vapi.start(cfg.assistantId);
        } catch (e) {
          showError('Could not start call — allow microphone and retry');
          btn.disabled = false;
        }
      };

      status.textContent = 'Click to start call';
    } catch (e) {
      showError('Setup failed: ' + e.message);
    }

    async function loadReview() {
      if (!callId) {
        status.textContent = 'No call id — check Vapi setup';
        return;
      }

      for (let i = 0; i < 15; i++) {
        const res = await fetch('/api/review/' + callId);
        if (res.status === 200) {
          showReview(await res.json());
          return;
        }
        await new Promise(r => setTimeout(r, 2000));
      }
      status.textContent = 'Summary not ready yet';
    }

    function showReview(data) {
      const risk = data.risk_assessment || {};
      const symptoms = data.symptoms_found || {};
      const action = data.action_required || {};

      document.getElementById('risk').textContent = (risk.level || 'UNKNOWN') + ' RISK';
      document.getElementById('risk').className = 'risk ' + (risk.level || '');
      document.getElementById('reason').textContent = risk.reason || '';
      document.getElementById('lang').textContent = data.language_used || '';
      document.getElementById('skin').textContent = symptoms.skin_patch || 'None';
      document.getElementById('numb').textContent = symptoms.numbness || 'None';
      document.getElementById('weak').textContent = symptoms.hand_foot_weakness || 'None';
      document.getElementById('advice').textContent = action.patient_sms_advice || '';
      document.getElementById('dispatch').textContent = action.send_health_worker
        ? 'Recommend health worker follow-up'
        : 'No health worker dispatch needed';
      panel.classList.add('show');
    }
  </script>
</body>
</html>
